[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicg"
version = "0.1.0"
description = "AI 实时构图指导 Agent —— 边拍边教的多模态实时引导系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "待确认" }]
keywords = ["computer-vision", "composition", "real-time", "multimodal", "agent"]

dependencies = [
    "numpy>=1.26,<3.0",
    "opencv-python>=4.9",
    "pydantic>=2.6,<3.0",
    "PyYAML>=6.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
# 真实模型后端（含 torch，体积大）
model = ["ultralytics>=8.2"]
# 接口层
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
# 语言层
llm = ["openai>=1.30", "httpx>=0.27"]
# 向量检索（FR-09）
vector = ["pymilvus>=2.4"]
# 开发
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
# 分析（指标与图表）
analysis = ["scipy>=1.13", "scikit-learn>=1.5", "matplotlib>=3.8"]
# 一次装齐（不含 vector，避免无关的重依赖）
all = ["aicg[model,api,llm,dev,analysis]"]

[project.scripts]
aicg-demo = "scripts.run_demo:main"

[tool.setuptools]
packages = ["aicg"]

[tool.setuptools.package-dir]
aicg = "src/aicg"

# ---------------------------------------------------------------------------
# 工具配置
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: 耗时较长的测试（涉及模型加载），可用 -m 'not slow' 跳过",
    "gpu: 需要 CUDA 的测试",
]

[tool.coverage.run]
source = ["src/aicg"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # 行长由 formatter 控制
    "N803",   # 允许 bbox 等视觉领域惯用的小写参数名
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"
exclude = ["^tests/"]
